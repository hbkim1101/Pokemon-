name: Pokemon Arena Smoke Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax, 8-way motions and disabled extra skills
        run: node tests/smoke.cjs
      - name: Validate the Mint League story rules
        run: node tests/story-smoke.cjs
      - name: Validate real-time story battles
        run: node tests/story-arena.cjs
      - name: Inspect source sprite alpha around all emitter points
        continue-on-error: true
        run: python3 tests/audit_emission_pixels.py
