name: Pokemon Arena Smoke Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax, 8-way motions and disabled extra skills
        run: node tests/smoke.cjs
      - name: Inspect source sprite alpha around all emitter points
        continue-on-error: true
        run: python3 tests/audit_emission_pixels.py
      - name: Render source sprite mouth contact strips
        run: PYTHONPATH=tests python3 tests/preview_mouth.py
      - name: Zoom mouth markers during recovery and firing
        env:
          PMD_CONTACT_FRAMES: 6,8,13
          PMD_CONTACT_SCALE: '4'
          PMD_CONTACT_PAIRS: 2,3;5,6
        run: PYTHONPATH=tests python3 tests/preview_mouth.py
      - name: Zoom muzzle at held and start poses
        env:
          PMD_CONTACT_FRAMES: 0,13
          PMD_CONTACT_SCALE: '4'
          PMD_CONTACT_PAIRS: 0,1;3,4;7,0
        run: PYTHONPATH=tests python3 tests/preview_mouth.py
